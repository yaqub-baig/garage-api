version: "3.8"

services:
  mysql-docker:
    image: mysql:8
    container_name: mysql-docker
    environment:
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - "3308:3306"
    volumes:
      - ./mysql-init:/docker-entrypoint-initdb.d
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - auto-adda-network


  identity-api:
    build:
      context: ./identity-api
    container_name: identity-api
    depends_on:
      mysql-docker:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-docker:3306/auto_adda_identity
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root123
    ports:
      - "8010:8010"
    networks:
      - auto-adda-network

  garage-api:
    build:
      context: ./garage-api
    container_name: garage-api
    depends_on:
      mysql-docker:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-docker:3306/auto_adda_garage
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root123
    ports:
      - "8020:8020"
    networks:
      - auto-adda-network

  vehicle-api:
    build:
      context: ./vehicle-api
    container_name: vehicle-api
    depends_on:
      mysql-docker:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-docker:3306/auto_adda_vehicle
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root123
    ports:
      - "8030:8030"
    networks:
      - auto-adda-network


  part-api:
    build:
      context: ./part-api
    container_name: part-api
    depends_on:
      mysql-docker:
        condition: service_healthy

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-docker:3306/auto_adda_parts
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root123
    ports:
      - "8060:8060"
    networks:
      - auto-adda-network



