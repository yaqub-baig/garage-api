spring.application.name=garage-api
#spring.datasource.url=jdbc:mysql://103.211.202.187:3306/adminmylstech_auto_adda_garage?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.url=jdbc:mysql://localhost:3306/auto_adda_garage?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.profiles.active=local
spring.datasource.username=root
#spring.datasource.password=Mylstech@100
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.tryItOutEnabled=true

file.upload-dir=../uploaded-files
file.base-url=http://192.168.1.14:8080/garage-service/api/v1

# Multipart Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.file-size-threshold=2KB
spring.servlet.multipart.resolve-lazily=false

# Tomcat Configuration
server.tomcat.max-http-form-post-size=200MB
server.tomcat.max-swallow-size=200MB
server.tomcat.connection-timeout=60000
server.tomcat.max-connections=8192
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10

# Connection timeout for large uploads
server.connection-timeout=60000

# HTTP Configuration
server.max-http-header-size=64KB


logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.client=DEBUG
logging.level.com.autoadda.apis.garage.service.PartRequestService=DEBUG
logging.level.com.autoadda.apis.garage.service.VehicleDeliveryService=DEBUG

garage.service.base.url=http://localhost:8020/api/v1
garage.service.base.prod.url=https://garage.devuzair.site/api/v1
server.port=8020
server.servlet.contextPath=/api/v1
notification.service.send.email.url=http://localhost:8093/api/v1/notification/send
authentication.encrypt.secret=Platform$123
platform.auth.service.email.confirm.url=http://localhost:8091/api/v1/auth/email/confirm
spring.mvc.pathmatch.matching-strategy=ant_path_matcher
spring.security.enabled=false
security.basic.enabled=false


# HikariCP pool settings (Spring Boot default)
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

eureka.client.service-url.defaultZone= http://localhost:8761/eureka/
eureka.client.register-with-eureka= false
eureka.client.fetch-registry= false

eureka.instance.prefer-ip-address: true
eureka.instance.ip-address: 192.168.1.14
eureka.instance.lease-renewal-interval-in-seconds: 10
eureka.instance.lease-expiration-duration-in-seconds: 20