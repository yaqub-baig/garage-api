spring.application.name=garage-management-service
spring.datasource.url=jdbc:mysql://localhost:3306/car_adda_garage
spring.profiles.active=local
spring.datasource.username=root
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

file.upload-dir=../uploaded-files
file.base-url=http://192.168.1.14:8080/garage-management-service/api/v1

