spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=150MB

server.tomcat.max-http-form-post-size=150MB
server.tomcat.max-swallow-size=150MB

garage.service.base.url=http://localhost:8097/api
garage.service.base.prod.url=https://carserviceplatform-api.com
server.port=8098
server.servlet.contextPath=/api
notification.service.send.email.url=http://localhost:8093/api/v1/notification/send
authentication.encrypt.secret=Platform$123
platform.auth.service.email.confirm.url=http://localhost:8091/api/v1/auth/email/confirm
spring.mvc.pathmatch.matching-strategy=ant_path_matcher
spring.security.enabled=false
security.basic.enabled=false
# Email configuration for sending notifications
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your_email@gmail.com
spring.mail.password=your_password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


eureka.client.service-url.defaultZone= http://localhost:8761/eureka/
eureka.client.register-with-eureka= true
eureka.client.fetch-registry= true

eureka.instance.prefer-ip-address: true
eureka.instance.ip-address: 192.168.1.14
eureka.instance.lease-renewal-interval-in-seconds: 10
eureka.instance.lease-expiration-duration-in-seconds: 20